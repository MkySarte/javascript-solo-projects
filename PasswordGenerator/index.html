<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div>
        <div>
            <h1>Generate a</h1>
            <h1 class="colored">random password</h1>

            <h2>Never use an insecure password again.</h2>
        </div>

        <button id="button-el">Generate passwords</button>

        <div class="slider-container">
            <input type="range" id="meinSlider" min="8" max="24" value="15">
            <p>Password length: <span id="sliderWert">15</span></p>
        </div>
        <hr class="line">
        <div>
            <label class="switch">
                <p>Check if you dont want symbols an numbers</p>
                <div class="checkIt">
                    <input type="checkbox" id="myCheck">
                    <p id="text" style="display:none">Letters only enabled.</p>
                </div>

            </label>
        </div>

        <hr class="line">

        <div class="password">
            <p class="password-p" id="password-number-one"></p>

            <p class="password-p" id="password-number-two"></p>

        </div>
    </div>



    <script src="index.js"></script>
</body>

</html>
